<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <!-- Favicon/apple-touch-icon são injetados pelo head gerenciado (src/seo/head.ts),
       tanto no prerender quanto no client — declarar aqui duplicava o link. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Fontes no <link> e não em @import no CSS: aqui o parser dispara o download
       junto com o resto do head, em vez de esperar o bundle de CSS baixar para
       só então descobrir a URL da fonte. O preconnect abre a conexão TLS com o
       gstatic antes de o arquivo ser pedido. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
  />
  <script>
    document.documentElement.dataset.motion = 'enabled';
  </script>
  <!--
    Analytics GRÁTIS e cookieless (sem banner LGPD, peso mínimo no Core Web Vitals).
    Recomendado: Cloudflare Web Analytics (conta grátis, funciona no GitHub Pages).
    Para ativar:
      1) Crie conta grátis em https://dash.cloudflare.com -> Web Analytics -> Add a site (usehorarius.com.br)
      2) Copie o token gerado para data-cf-beacon abaixo e descomente a linha.
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"SEU_TOKEN_AQUI"}'></script>

    Alternativa grátis self-hosted (você já tem docker em /opt/apps/horarius): Umami.
    <script defer src="https://SEU_UMAMI/script.js" data-website-id="SEU_WEBSITE_ID"></script>
  -->
  <!--app-head-->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
